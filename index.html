<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Calculator</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide|Google+Sans|Roboto|Inter">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/script.js" defer></script>
</head>
<body>
  <h1>JavaScript Calculator</h1>
  <div class="main">
    <div class="display-wrapper">
      <div class="display">0</div>
    </div>
    <div class="outer-container container">
      <div class="container">
        <div class="buttons">
          <div class="ac-ce">
            <button id="ac">AC</button>
            <button id="ce">CE</button>
          </div>
        </div>
        <div class="buttons">
          <button id="seven">7</button>
          <button id="eight">8</button>
          <button id="nine">9</button>
          <button class="symbols" id="divided-by">&div;</button>
        </div>
        <div class="buttons">
          <button id="four">4</button>
          <button id="five">5</button>
          <button id="six">6</button>
          <button class="symbols" id="times">x</button>
        </div>
        <div class="buttons">
          <button id="one">1</button>
          <button id="two">2</button>
          <button id="three">3</button>
          <button class="symbols" id="minus">-</button>
        </div>
        <div class="buttons">
          <button id="zero">0</button>
          <button id="dot">.</button>
          <button id="equals">=</button>
          <button class="symbols" id="plus">+</button>
        </div>
      </div>
      <div class="copyright">&copy; LearnHowToProgram</div>
    </div>
  </div>
</body>
</html>
